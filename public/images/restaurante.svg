<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="t">
  <title id="t">Plato de la bandera dominicana: arroz, habichuelas, carne guisada y ensalada</title>
  <rect width="360" height="260" fill="#fff7eb"/>
